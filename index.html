<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="药学知识">
<meta name="description" content="有机化学、药理学、分析化学三科考研知识点卡片式学习与随机出题练习">
<title>药学知识 · 三科通关</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<!-- 资源版本号：变更前端代码时同步 +1，可强制绕过 CDN / 浏览器旧缓存 -->
<link rel="stylesheet" href="css/app.css?v=27">
</head>
<body>
<div class="app">
  <div class="scrim" id="scrim" hidden></div>

  <aside class="sidebar" id="sidebar" aria-label="侧边栏">
    <div class="brand">
      <img class="logo" src="icon.svg" alt="" width="34" height="34">
      <div class="brand-text">
        <strong>药学知识</strong>
        <span>三科通关 · 卡片式记忆</span>
      </div>
    </div>

    <button class="side-action" id="quizBtn" type="button">
      <span>随机出题练习</span><i id="quizTotal"></i>
    </button>

    <div class="sidebar-block">
      <div class="sidebar-label">题库</div>
      <nav class="subject-nav" id="bankNav" aria-label="题库"></nav>
    </div>

    <div class="sidebar-label">科目</div>
    <nav class="subject-nav" id="subjectNav"></nav>

    <div class="sidebar-block" id="moduleBlock" hidden>
      <div class="sidebar-label" id="moduleLabel">模块导航</div>
      <div class="module-list" id="moduleList"></div>
    </div>

    <div class="sidebar-block">
      <div class="sidebar-label">今日计划</div>
      <div id="planBody"></div>
    </div>

    <div class="sidebar-block">
      <div class="sidebar-label">云端同步</div>
      <div id="syncBody"></div>
    </div>

    <div class="sidebar-foot">
      <div class="sidebar-label">全部内容已按考试大纲筛选，仅保留大纲内考点</div>
      <button class="ghost-btn" id="installBtn" type="button" hidden>安装到桌面 / 主屏幕</button>
      <button class="ghost-btn" id="themeBtn" type="button">外观：跟随系统</button>
      <button class="ghost-btn" id="resetBtn" type="button">清空学习进度</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="打开菜单">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M1 2.75A.75.75 0 0 1 1.75 2h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 2.75Zm0 5A.75.75 0 0 1 1.75 7h12.5a.75.75 0 0 1 0 1.5H1.75A.75.75 0 0 1 1 7.75Zm0 5a.75.75 0 0 1 .75-.75h12.5a.75.75 0 0 1 0 1.5H1.75a.75.75 0 0 1-.75-.75Z"/></svg>
      </button>
      <div class="topbar-title">
        <strong id="topTitle">三科通关</strong>
        <span id="topSub">选择科目开始学习</span>
      </div>
      <button class="icon-btn" id="searchBtn" type="button" aria-label="搜索知识点">
        <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
      </button>
    </header>

    <div class="progress-strip" id="progressStrip" hidden>
      <div class="bar"><i id="progressBar" style="width:0%"></i></div>
      <span id="progressText">0 / 0</span>
    </div>

    <section class="view" id="viewHome"></section>
    <section class="view" id="viewStudy" hidden></section>
    <section class="view" id="viewQuiz" hidden></section>
  </main>
</div>

<div class="actionbar" id="actionbar" hidden></div>

<div class="overlay" id="searchOverlay" hidden>
  <div class="overlay-head">
    <div class="search-box">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10.68 11.74a6 6 0 0 1-7.922-8.982 6 6 0 0 1 8.982 7.922l3.04 3.04a.749.749 0 0 1-.326 1.275.749.749 0 0 1-.734-.215ZM11.5 7a4.499 4.499 0 1 0-8.997 0A4.499 4.499 0 0 0 11.5 7Z"/></svg>
      <input id="searchInput" type="search" placeholder="搜索反应 / 首选药 / 名词" autocomplete="off" enterkeyhint="search">
    </div>
    <button class="text-btn" id="searchClose" type="button">取消</button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="overlay sheet" id="planLogin" hidden>
  <div class="overlay-head">
    <strong class="sheet-title">连接复习计划生成器</strong>
    <button class="text-btn" id="planLoginClose" type="button">取消</button>
  </div>
  <div class="sheet-body">
    <p class="sheet-tip">填入你在「349 复习计划」里注册的邮箱和密码，只读取每日计划，不会修改计划数据。</p>
    <input id="planEmail" class="sync-input" style="text-transform:none;letter-spacing:0"
      type="email" placeholder="邮箱" autocomplete="username">
    <input id="planPwd" class="sync-input" style="text-transform:none;letter-spacing:0"
      type="password" placeholder="密码" autocomplete="current-password">
    <button class="btn btn-primary" id="planLoginGo" type="button">连接并同步今日计划</button>
  </div>
</div>

<div class="overlay" id="schOverlay" hidden>
  <div class="overlay-head">
    <strong class="sheet-title">选择今日章节</strong>
    <button class="text-btn" id="schClose" type="button">完成</button>
  </div>
  <div class="sch-list" id="schList"></div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="overlay auth-gate" id="authGate">
  <div class="sheet">
    <div class="overlay-head">
      <strong class="sheet-title">登录</strong>
    </div>
    <div class="sheet-body">
      <p class="sheet-tip">输入账号密码，之后长期免密进入（会话到期会在后台自动续期）。</p>
      <input id="authUser" class="sync-input" type="text" placeholder="账号"
        autocomplete="username" autocapitalize="off" autocorrect="off"
        style="text-transform:none;letter-spacing:0">
      <input id="authPass" class="sync-input" type="password" placeholder="密码"
        autocomplete="current-password" style="text-transform:none;letter-spacing:0">
      <button class="btn btn-primary" id="authGo" type="button">登录</button>
      <p class="sheet-tip" id="authErr" style="color:#e5534b;min-height:1em"></p>
    </div>
  </div>
</div>

<script src="js/supabase.js?v=27"></script>
<script src="js/app.js?v=27"></script>
</body>
</html>
